<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">LOJA GAMES</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">DASHBOARD</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('lista') }}">LISTA DE USUÁRIOS</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Usuário
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('cadastro') }}">Cadastro</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('login') }}">Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="form-cadastro-geral">
        <form class="form-cadastro row g-3">
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Nome:</label>
                <input type="name" class="form-control" id="nome">
            </div>
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="inputPassword4">
            </div>
            <div class="col-md-3">
                <label for="inputEmail4" class="form-label">Celular:</label>
                <input type="tel" class="form-control" id="inputEmail4">
            </div>
            <div class="col-md-3">
                <label for="inputPassword4" class="form-label">Data de Nascimento:</label>
                <input type="date" class="form-control" id="inputPassword4">
            </div>
            <div class="col-md-3">
                <label for="inputEmail4" class="form-label">CPF:</label>
                <input type="number" class="form-control" id="inputEmail4">
            </div>
            <div class="col-md-3">
                <label for="inputPassword4" class="form-label">Nivel de Acesso:</label>
                <label for="inputState" class="form-label">Estado:</label>
                <select id="inputState" class="form-select">
                    <option selected>--ESCOLHA--</option>
                    <option>...</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="inputPassword4" class="form-label">CEP:</label>
                <input type="number" class="form-control" id="inputPassword4">
            </div>
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Endereço:</label>
                <input type="name" class="form-control" id="inputEmail4">
            </div>
            <div class="col-md-3">
                <label for="inputPassword4" class="form-label">Número:</label>
                <input type="number" class="form-control" id="inputPassword4">
            </div>
            <div class="col-md-4">
                <label for="inputEmail4" class="form-label">Complemento:</label>
                <input type="name" class="form-control" id="inputEmail4">
            </div>
            <div class="col-md-4">
                <label for="inputEmail4" class="form-label">Cidade:</label>
                <input type="name" class="form-control" id="inputEmail4">
            </div>
            <div class="col-md-4">
                <label for="inputState" class="form-label">Estado:</label>
                <select id="inputState" class="form-select">
                    <option selected>--ESCOLHA--</option>
                    <option>...</option>
                </select>
            </div>
            <div class="div-btn-cadastro">
                <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
